---
- name: install nginx and start nginx 
  hosts: webserver 
  become: yes 

  tasks: 
    - name: install nginx 
      ansible.builtin.apt:
        name: nginx
        state: present 
    
    - name: start nginx 
      ansible.builtin.service:
        name: nginx 
        state: started 

    - name: enable nginx 
      ansible.builtin.service: 
        name: nginx 
        enabled: yes 